name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/enabled-codeql

jobs:
  build-zephyr:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.28-branch
      options: --user root

    steps:
      # Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl unzip 

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: application
          submodules: recursive
          fetch-depth: 1
      
      - name: West and Zephyr setup
        run: |
          west init -l ./application
          west config --global update.narrow true
          west update -o=--depth=1 --group-filter=-tests,-samples,-bablesim,-docs
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$ZSDK_VERSION" >> $GITHUB_ENV
          echo "`df -h`"          

      - name: Clean up after checkout and west update
        run: |
          rm -rf ./application/.git/rebase-apply
          rm -rf ./application/.git/rebase-merge
          cd ./application
          git clean -f -d
          cd ..

      # Download CodeQL Coding Standards
      - name: Download CodeQL Coding Standards
        run: |
          # Download the latest coding standards packs
          curl -L -o coding-standards-codeql-packs.zip \
            "https://github.com/github/codeql-coding-standards/releases/download/v2.50.0/coding-standards-codeql-packs.zip"
          
          # Extract the packs
          unzip coding-standards-codeql-packs.zip
          ls -la
          
          # The extracted directory should contain the packs
          find . -name "*.tar.gz" -type f

      # Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c
          config-file: ./.github/codeql/codeql-config.yml
          queries: |
            security-and-quality
            codeql/c-coding-standards/misra-c-2023-default


      - name: Build b_u585i_iot02a
        run: |
          west build --pristine -b b_u585i_iot02a ./application -d build -- -DMODULE_EXT_ROOT=$(pwd)/application

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
          upload: true          